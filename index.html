<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stack Shift</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #111720;
      color: #f2f7ff;
    }

    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 940px; margin: auto; padding: 28px 20px; }
    h1 { font-size: clamp(2.7rem, 8vw, 5rem); line-height: 1; margin: 0; letter-spacing: -.06em; }
    h2 { font-size: 1.1rem; margin: 0; }
    p { color: #bac7d8; line-height: 1.5; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 250px; gap: 16px; }
    .panel { background: #192330; border: 1px solid #344359; border-radius: 16px; padding: 16px; }
    .stats { display: flex; gap: 24px; margin: 0 0 12px; }
    .stats div { display: grid; gap: 2px; }
    dt { color: #bac7d8; font-size: .85rem; }
    dd { margin: 0; font: bold 1.5rem ui-monospace, monospace; }
    canvas { display: block; width: 100%; height: auto; background: #101925; border-radius: 10px; touch-action: manipulation; }
    button { margin-top: 12px; width: 100%; border: 0; border-radius: 8px; padding: 12px; background: #b7f477; color: #17230d; font: bold 1rem system-ui; cursor: pointer; touch-action: manipulation; }
    button:focus-visible { outline: 3px solid white; outline-offset: 3px; }
    #status { margin: 10px 0 0; }
    table { width: 100%; margin-top: 12px; border-collapse: collapse; text-align: right; font-variant-numeric: tabular-nums; }
    th, td { padding: 8px 4px; border-bottom: 1px solid #344359; }
    th:first-child, td:first-child { text-align: left; }
    aside p { font-size: .9rem; }
    @media (max-width: 640px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Stack Shift</h1>
      <p>Press Space or tap the board to stack a sliding block. Overhangs get trimmed.</p>
    </header>
    <div class="layout">
      <section class="panel" aria-label="Stack Shift game">
        <dl class="stats">
          <div><dt>Blocks</dt><dd id="score">0</dd></div>
          <div><dt>Perfect drops</dt><dd id="perfect">0</dd></div>
        </dl>
        <canvas id="board" width="480" height="400" aria-label="Stack Shift playfield"></canvas>
        <button id="action" type="button">Start</button>
        <p id="status" role="status">Ready to stack.</p>
      </section>
      <aside class="panel">
        <h2>Local high scores</h2>
        <p>Top five runs in this browser. Perfect drops break ties.</p>
        <table>
          <thead><tr><th scope="col">Rank</th><th scope="col">Blocks</th><th scope="col">Perfect</th></tr></thead>
          <tbody id="scores"></tbody>
        </table>
      </aside>
    </div>
  </main>
  <script>
    const board = document.querySelector('#board');
    const context = board.getContext('2d');
    const action = document.querySelector('#action');
    const status = document.querySelector('#status');
    const scoreLabel = document.querySelector('#score');
    const perfectLabel = document.querySelector('#perfect');
    const scoreRows = document.querySelector('#scores');
    const storageKey = 'stack-shift-scores';
    const blockHeight = 30;
    const baseY = board.height - 32;
    const palette = ['#b7f477', '#79e3c4', '#6dcaf1', '#aab5ff', '#f4a6d8', '#ffce79'];

    let highScores = loadScores();
    let phase = 'ready';
    let stack = [baseBlock()];
    let moving;
    let perfectDrops = 0;
    let lastFrame;

    function baseBlock() {
      return { x: 160, width: 160, color: '#677d98' };
    }

    function rankScores(scores) {
      return scores.sort((a, b) => b.blocks - a.blocks || b.perfect - a.perfect).slice(0, 5);
    }

    function loadScores() {
      try {
        const saved = JSON.parse(localStorage.getItem(storageKey));
        if (Array.isArray(saved)) {
          return rankScores(saved.filter(run =>
            run && Number.isSafeInteger(run.blocks) && run.blocks > 0 &&
            Number.isSafeInteger(run.perfect) && run.perfect >= 0 && run.perfect <= run.blocks
          ));
        }
      } catch {
        // The game works when browser storage is unavailable.
      }
      return [];
    }

    function showScores() {
      scoreRows.replaceChildren();
      if (!highScores.length) {
        const row = scoreRows.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 3;
        cell.textContent = 'No scores yet';
        return;
      }
      highScores.forEach((run, index) => {
        const row = scoreRows.insertRow();
        for (const value of [index + 1, run.blocks, run.perfect]) {
          row.insertCell().textContent = value;
        }
      });
    }

    function spawnBlock() {
      const width = stack.at(-1).width;
      const direction = stack.length % 2 === 1 ? 1 : -1;
      moving = {
        x: direction === 1 ? 0 : board.width - width,
        width,
        direction,
        color: palette[(stack.length - 1) % palette.length]
      };
    }

    function start() {
      stack = [baseBlock()];
      perfectDrops = 0;
      lastFrame = undefined;
      phase = 'playing';
      scoreLabel.textContent = '0';
      perfectLabel.textContent = '0';
      status.textContent = 'Line up the block and drop it.';
      action.textContent = 'Drop block';
      spawnBlock();
      draw();
    }

    function finish() {
      phase = 'ended';
      moving = undefined;
      const blocks = stack.length - 1;
      if (blocks > 0) {
        highScores = rankScores([...highScores, { blocks, perfect: perfectDrops }]);
        try {
          localStorage.setItem(storageKey, JSON.stringify(highScores));
        } catch {
          // Keep scores available for this session.
        }
        showScores();
      }
      action.textContent = 'Play again';
      status.textContent = 'Run over. ' + blocks + ' stacked, ' + perfectDrops + ' perfect.';
      draw();
    }

    function drop() {
      const top = stack.at(-1);
      const left = Math.max(top.x, moving.x);
      const right = Math.min(top.x + top.width, moving.x + moving.width);
      if (right <= left) {
        finish();
        return;
      }

      const perfect = Math.abs(top.x - moving.x) <= Math.min(5, top.width / 5);
      if (perfect) perfectDrops += 1;
      stack.push({
        x: perfect ? top.x : left,
        width: perfect ? top.width : right - left,
        color: moving.color
      });
      scoreLabel.textContent = stack.length - 1;
      perfectLabel.textContent = perfectDrops;
      status.textContent = perfect ? 'Perfect drop.' : 'Overhang trimmed.';
      spawnBlock();
      draw();
    }

    function play() {
      if (phase === 'playing') drop();
      else start();
    }

    function drawBlock(block, y) {
      context.fillStyle = block.color;
      context.fillRect(block.x, y, block.width, blockHeight - 2);
      context.fillStyle = '#ffffff40';
      context.fillRect(block.x, y, block.width, 3);
    }

    function draw() {
      context.clearRect(0, 0, board.width, board.height);
      context.strokeStyle = '#25354a';
      context.beginPath();
      for (let x = 0; x <= board.width; x += 24) {
        context.moveTo(x, 0);
        context.lineTo(x, board.height);
      }
      for (let y = 8; y <= board.height; y += 24) {
        context.moveTo(0, y);
        context.lineTo(board.width, y);
      }
      context.stroke();

      const movingY = baseY - Math.min(stack.length, 9) * blockHeight;
      const topY = movingY + blockHeight;
      for (let index = Math.max(0, stack.length - 12); index < stack.length; index += 1) {
        drawBlock(stack[index], topY + (stack.length - 1 - index) * blockHeight);
      }
      if (moving) drawBlock(moving, movingY);
    }

    function animate(time) {
      if (phase === 'playing') {
        const elapsed = lastFrame === undefined ? 0 : Math.min(50, time - lastFrame) / 1000;
        const limit = board.width - moving.width;
        const speed = Math.min(500, 155 + (stack.length - 1) * 12);
        moving.x += moving.direction * speed * elapsed;
        if (moving.x > limit || moving.x < 0) {
          moving.x = moving.x > limit ? 2 * limit - moving.x : -moving.x;
          moving.direction *= -1;
        }
        draw();
      }
      lastFrame = time;
      requestAnimationFrame(animate);
    }

    action.addEventListener('click', play);
    board.addEventListener('click', play);
    document.addEventListener('keydown', event => {
      if (event.code !== 'Space') return;
      event.preventDefault();
      if (!event.repeat) play();
    });
    document.addEventListener('visibilitychange', () => { lastFrame = undefined; });

    showScores();
    draw();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
