<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tower Stack</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-page">
    <header>
      <h1>Tower Stack</h1>
      <p>Press Space or tap the board to stack a sliding block. Overhangs get trimmed.</p>
    </header>
    <nav aria-label="Tower Stack pages"><a class="page-link" href="../">← Arcade</a> <a class="page-link" href="leaderboard.html">Leaderboard</a></nav>
    <section class="panel" aria-label="Tower Stack game">
      <dl class="stats">
        <div><dt>Blocks</dt><dd id="score">0</dd></div>
        <div><dt>Perfect drops</dt><dd id="perfect">0</dd></div>
      </dl>
      <canvas id="board" width="480" height="400" aria-label="Tower Stack playfield"></canvas>
      <button id="action" type="button">Start</button>
      <p id="status" role="status">Ready to stack.</p>
    </section>
  </main>
  <script src="scores.js"></script>
  <script src="game.js"></script>
</body>
</html>
