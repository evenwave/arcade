<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11161d">
  <title>Leaderboard | Book Stack</title>
  <link rel="stylesheet" href="styles.css?v=book4">
</head>
<body>
  <main class="leaderboard-page">
    <header class="game-header">
      <a class="page-link nav-back" href="../">← All games</a>
      <h1>Book <span>Stack</span></h1>
      <a class="page-link nav-scores" href="index.html?v=book4">Back to game</a>
    </header>
    <section class="panel" aria-label="Local high scores">
      <div class="panel-heading"><h2>✧ Leaderboard</h2><span>Top five · This device</span></div>
      <p>Your best runs in this browser. Perfect drops break ties.</p>
      <table aria-label="Top Book Stack runs">
        <thead><tr><th scope="col">Rank</th><th scope="col">Books</th><th scope="col">Perfect</th></tr></thead>
        <tbody id="scores"></tbody>
      </table>
    </section>
  </main>
  <script src="scores.js"></script>
  <script src="leaderboard.js"></script>
</body>
</html>
